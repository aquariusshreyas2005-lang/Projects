<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pass History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <nav>
    <a href="dashboard.html">Dashboard</a> |
    <a href="history.html">History</a> |
    <a href="#" onclick="logout()">Logout</a>
  </nav>
  <div class="container">
    <h1>📚 Bus Pass History</h1>
    <div id="historyList"></div>
  </div>
  <script>
    const user = localStorage.getItem("loggedInUser");
    const passes = JSON.parse(localStorage.getItem("busPasses") || "[]");
    const list = document.getElementById("historyList");

    const userPasses = passes.filter(p => p.email === user);

    userPasses.forEach(p => {
      const expiry = new Date(p.expiry);
      const now = new Date();
      const status = expiry >= now ? "✅ Active" : "❌ Expired";

      const div = document.createElement("div");
      div.classList.add("pass");
      div.innerHTML = `
        <strong>${p.name}</strong><br>ID: ${p.id}<br>
        Type: ${p.passType}<br>
        Issued: ${p.date}<br>
        Expires: ${p.expiry} (${status})
      `;
      list.appendChild(div);
    });

    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
