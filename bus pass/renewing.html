<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Renewing Pass</title>
  <style>
    body {
      background: #e3f2fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      color: #1976d2;
      margin-bottom: 50px;
      z-index: 1;
    }

    .bus {
      width: 120px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      animation: moveBus 4s linear forwards;
      z-index: 0;
    }

    @keyframes moveBus {
      0% { left: -150px; }
      100% { left: 100vw; }
    }

    .return-btn {
      margin-top: 300px;
      padding: 12px 24px;
      font-size: 18px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1;
    }

    .return-btn:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>
  <h1>Renewing Your Bus Pass... Please wait</h1>

  <!-- ✅ Direct image link for the animated bus -->
  <img src="https://th.bing.com/th/id/OIP.ZfSAVBT2reCfNs-mvHn_MgHaHa?w=166&h=180&c=7&r=0&o=7&cb=iwp2&dpr=1.3&pid=1.7&rm=3" class="bus" alt="Bus">

  <button class="return-btn" onclick="goToDashboard()">Return to Dashboard</button>

  <script>
    function goToDashboard() {
      window.location.href = "dashboard.html";
    }

    // Auto-redirect after 5 seconds
    setTimeout(goToDashboard, 5000);
  </script>
</body>
</html>
